<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АРХИСБОР — платформер архитектурных терминов</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23F74C2E'/%3E%3Cstop offset='.55' stop-color='%23F28D05'/%3E%3Cstop offset='1' stop-color='%23D0E97E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3Crect x='20' y='20' width='6' height='6' rx='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== ФИРМЕННЫЙ ШРИФТ (Tilda CDN) ===== */
@font-face{
  font-family:'AdvakenSans-Expanded';
  src:url('https://static.tildacdn.com/tild3263-6664-4563-a238-353561323362/advakensans-expanded.woff2') format('woff2');
  font-weight:400 500; font-display:swap;
}

/* ===== ТОКЕНЫ (дизайн-бриф, часть C) ===== */
:root{
  --c-dark:        #262626;
  --c-ink:         #161010;
  --c-white:       #FFFFFF;
  --c-section:     #F7F7F7;
  --c-red:         #F74C2E;
  --c-orange:      #F28D05;
  --c-orange-soft: #FF8562;
  --c-blue:        #4D61F4;
  --c-lime:        #D0E97E;
  --c-pink:        #FFB6FC;
  --on-dark-dim:   rgba(255,255,255,.62);
  --on-dark-faint: rgba(255,255,255,.46);
  --on-light-dim:  #5c5c5c;
  --grad-brand: linear-gradient(135deg,#F74C2E 0%,#F28D05 55%,#D0E97E 100%);

  --font-display: 'AdvakenSans-Expanded','Arial Narrow',Arial,sans-serif;
  --font-text:    'Inter Tight',Arial,sans-serif;

  --fs-display-l:  48px;  --lh-display-l: .8;
  --fs-display-m:  34px;  --lh-display-m: .85;
  --fs-lead:       14px;  --lh-lead: 1.45;
  --fs-body:       13px;  --lh-body: 1.5;
  --fs-small:      11px;  --lh-small: 1.5;
  --fs-tag:        10px;  --lh-tag: 1.5;

  --r-md: 12px; --r-card: 24px; --r-pill-sm: 30px; --r-pill-md: 60px; --r-pill: 100px;

  --shadow-card: 0 4px 10px rgba(0,0,0,.20);
  --shadow-soft: 0 0 4px rgba(0,0,0,.08);

  --ease: cubic-bezier(.22,.68,0,1);
  --dur: .25s;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--c-section); overflow: hidden;
  font-family: var(--font-text); color: var(--c-dark); }
#app { width: 100vw; height: 100vh; }
canvas { display: block; }

/* ---------- оверлеи ---------- */
#overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#overlay > * { pointer-events: auto; }

/* машинная метка [ ... ] */
.tag{ display:inline-block; font:400 var(--fs-tag)/var(--lh-tag) var(--font-text);
  text-transform:uppercase; letter-spacing:.5px; }
.tag::before{ content:'[ '; } .tag::after{ content:' ]'; }
.tag--ondark{ color:var(--on-dark-dim); }
.tag--accent{ color:var(--c-orange); }

/* лестница из квадратов */
.stairs{ position:relative; width:32px; height:36px; flex:none; }
.stairs i{ position:absolute; background:var(--c-dark); }
.stairs i:nth-child(1){ width:12px; height:12px; left:0;   bottom:0; }
.stairs i:nth-child(2){ width:12px; height:24px; left:10px; bottom:0; }
.stairs i:nth-child(3){ width:12px; height:36px; left:20px; bottom:0; }
.stairs.on-dark i{ background:var(--c-section); }

/* дисплеи */
.display{ font-family:var(--font-display); font-weight:400; text-transform:uppercase; line-height:.85; }
.display .accent{ color:var(--c-orange); }
.display .accent-blue{ color:var(--c-blue); }

/* кнопки набора брифа */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; cursor:pointer; text-decoration:none;
  font:600 var(--fs-lead)/1.45 var(--font-text); letter-spacing:.25px;
  transition:transform var(--dur) var(--ease), opacity var(--dur) var(--ease); }
.btn:hover{ transform:scale(.97); }
@media (prefers-reduced-motion:reduce){ .btn:hover{ transform:none; } }
.btn-blue{ background:var(--c-blue); color:var(--c-white); border-radius:var(--r-pill-md); height:60px; padding:0 36px; }
.btn-ghost{ background:transparent; border:1px solid var(--c-white); border-radius:var(--r-pill);
  color:var(--c-white); height:54px; padding:0 32px; }
.btn-ghost--dark{ border-color:var(--c-dark); color:var(--c-dark); }

/* тост — тёмная пилюля как cookie-бар */
.toast{
  position:absolute; left:50%; bottom:42px; transform:translate(-50%,16px);
  display:flex; align-items:center; gap:16px;
  background:var(--c-dark); color:var(--c-white);
  border-radius:var(--r-pill-sm); padding:12px 20px;
  font:400 var(--fs-body)/1.5 var(--font-text); max-width:640px;
  opacity:0; transition:opacity .3s var(--ease), transform .3s var(--ease);
  box-shadow:var(--shadow-card);
}
.toast.show{ opacity:1; transform:translate(-50%,0); }
.toast .tag{ color:var(--c-lime); flex:none; }
.toast button{
  border:none; background:none; cursor:pointer; font-size:20px; line-height:1;
  color:var(--on-dark-faint); padding:0 2px;
}
.toast button:hover{ color:var(--c-white); }

/* ---------- карточка термина ---------- */
.termcard-wrap, .quiz, .end{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(38,38,38,.38);
  opacity:0; transition:opacity .3s var(--ease);
}
.termcard-wrap.show, .end.show{ opacity:1; }
.quiz{ opacity:1; }

.card{
  background:var(--c-white); border-radius:var(--r-card);
  box-shadow:var(--shadow-card); padding:40px 44px; text-align:center;
  animation:rise .4s var(--ease) both;
}
@keyframes rise{ from{ transform:translateY(6px); opacity:0; } to{ transform:none; opacity:1; } }
@media (prefers-reduced-motion:reduce){ .card{ animation:none; } }

.termcard{ max-width:600px; }
.termcard .tag{ color:var(--on-light-dim); margin-bottom:22px; }
.termcard-art{ display:flex; justify-content:center; margin-bottom:18px; }
.termcard-art svg{ height:150px; }
.termcard-art path{ fill:var(--c-section); stroke:var(--c-dark); stroke-width:3; stroke-linejoin:round; }
.termcard h2{ font-size:var(--fs-display-m); margin-bottom:14px; }
.termcard h2 .accent{ color:var(--c-orange); }
.termcard p{ font:400 var(--fs-lead)/1.55 var(--font-text); color:var(--on-light-dim);
  max-width:460px; margin:0 auto 26px; }

/* ---------- пауза и мобильный гейт ---------- */
.pause, .gate{
  position:absolute; inset:0; opacity:1;
  display:flex; align-items:center; justify-content:center;
}
.pause{ background:rgba(38,38,38,.38); }
.pause-card{ min-width:380px; }
.pause-card .tag{ color:var(--on-light-dim); margin-bottom:14px; }
.pause-card h2{ font-size:var(--fs-display-m); margin-bottom:22px; }
.controls{ display:grid; grid-template-columns:auto auto; gap:10px 26px;
  justify-content:center; text-align:left; margin-bottom:26px;
  font:400 var(--fs-body)/1.5 var(--font-text); }
.controls dt{ font-weight:600; white-space:nowrap; }
.controls dd{ color:var(--on-light-dim); }

/* ---------- викторина ---------- */
.quiz-card{ max-width:94vw; padding:36px 44px; }
.quiz-head{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px; }
.quiz-head .idx{ font:400 var(--fs-tag)/1.5 var(--font-text); letter-spacing:.5px; color:var(--on-light-dim); }
.quiz-head .idx::before{ content:'// '; opacity:.5; }
.quiz-card h2{ font-size:var(--fs-display-m); margin-bottom:26px; }
.quiz-opts{ display:flex; flex-wrap:wrap; justify-content:center; gap:16px; margin-bottom:18px; }
.quiz-opt{
  background:var(--c-white); border:none; border-radius:var(--r-card);
  box-shadow:var(--shadow-card); padding:14px 14px 8px; cursor:pointer;
  transition:transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.quiz-opt:hover{ transform:scale(.95); }
@media (prefers-reduced-motion:reduce){ .quiz-opt:hover{ transform:none; } }
.quiz-opt svg{ height:120px; max-width:17vw; display:block; }
.quiz-opt svg path{ fill:var(--c-section); stroke:var(--c-dark); stroke-width:3; }
.quiz-opt.is-right{ background:var(--c-lime); }
.quiz-opt.is-right svg path{ fill:var(--c-white); }
.quiz-opt.is-wrong{ background:var(--c-red); }
.quiz-opt.is-wrong svg path{ fill:rgba(255,255,255,.5); stroke:var(--c-white); }
.quiz-hint{ font:300 var(--fs-small)/1.5 var(--font-text); color:var(--on-light-dim); }

/* ---------- финал (тёмная секция) ---------- */
.end{ background:var(--c-dark); opacity:0; transition:opacity .4s var(--ease); }
.end.show{ opacity:1; }
.end-card{ background:transparent; box-shadow:none; animation:none; color:var(--c-white); max-width:900px; }
.end-card .stairs{ margin:0 auto 20px; }
.end-card h1{ font-size:var(--fs-display-l); margin-bottom:30px; }
.end-row{ display:flex; gap:44px; justify-content:center; align-items:flex-end; margin-bottom:26px; }
.end-row figure{ display:flex; flex-direction:column; gap:12px; align-items:center; }
.end-row svg{ height:104px; }
.end-row svg path{ fill:var(--c-white); stroke:var(--c-dark); stroke-width:2; stroke-linejoin:round; }
.end-row figcaption{ font:600 var(--fs-lead)/1.45 var(--font-text); }
.end-note{ font:300 var(--fs-body)/1.5 var(--font-text); color:var(--on-dark-dim); margin-bottom:30px; }
.end-note b{ color:var(--c-lime); font-weight:600; }

/* ---------- мобильный гейт (тёмный hero) ---------- */
.gate{ background:var(--c-dark); z-index:50; }
.gate-photo{
  position:absolute; inset:0;
  background:url('https://static.tildacdn.com/tild6234-6531-4630-b436-333963373633/pexels-michael-point.jpg') center/cover no-repeat;
  opacity:.16; filter:grayscale(30%);
}
.gate-card{ position:relative; text-align:center; color:var(--c-white); max-width:560px; padding:24px; }
.gate-mark{
  width:64px; height:64px; border-radius:18px; background:var(--grad-brand);
  margin:0 auto 22px; position:relative;
}
.gate-mark::after{
  content:''; position:absolute; width:22px; height:22px; border-radius:50%;
  background:var(--c-white); left:50%; top:42%; transform:translate(-50%,-50%);
}
.gate-card .tag{ color:var(--on-dark-dim); margin-bottom:16px; }
.gate h1{ font-size:var(--fs-display-l); margin-bottom:16px; }
.gate-note{ font:300 var(--fs-body)/1.5 var(--font-text); color:var(--on-dark-dim); margin-bottom:6px; }
.gate-big{ font:600 var(--fs-lead)/1.45 var(--font-text); margin-bottom:30px; }
.gate-actions{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

@media (max-width:480px){
  .gate h1{ font-size:34px; }
  .quiz-opt svg{ max-width:38vw; height:100px; }
  .card{ padding:28px 22px; }
}
</style>
